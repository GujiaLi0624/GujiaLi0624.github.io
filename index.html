<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GujiaLi 的个人主页</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: #f5f7fa;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 4px solid #4CAF50;
            display: inline-block;
            padding-bottom: 10px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 10px;
        }
        .btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>👋 你好，我是 GujiaLi</h1>
    <div class="card">
        <p>欢迎来到我的个人空间！</p>
        <p>📁 这里将用于存放我的研究资料和个人简历。</p>
        <p>📧 联系我：你的邮箱@example.com</p>
        <!-- 这里以后可以放你的简历PDF下载链接 -->
        <a href="#" class="btn">📄 查看我的简历 (即将上线)</a>
    </div>
    <p style="margin-top:30px; font-size:14px; color:#888;">Powered by GitHub Pages</p>
</body>
</html>
