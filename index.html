<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LGJ · Bioinformatics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #0a0f1e;
            color: #e0e8f0;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .app {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 30px 60px;
            min-height: 100vh;
            pointer-events: none;
        }
        .app * {
            pointer-events: auto;
        }
        /* Navbar, Sidebar, Content 样式保持不变（略）—— 沿用之前的样式，此处省略以节省空间，实际部署时请保留完整样式 */
        /* 实际使用时将下方样式补全，或直接复用之前 index.html 中的样式 */
    </style>
</head>
<body>

    <div class="app">
        <!-- 导航、侧边栏、内容模块（与之前完全相同，省略） -->
        <!-- 注意：实际部署时请将完整的 HTML 结构粘贴过来，包括导航、侧边栏、四个模块 -->
        <!-- 但为了测试特效，我们至少保留一个容器 -->
        <div style="color:white;text-align:center;padding:50px;">LGJ · Bioinformatics</div>
    </div>

    <!-- 引入 Three.js 和新特效 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="dna-story.js"></script>

</body>
</html>
