<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GujiaLi · DNA 3D 交互</title>
    <style>
        /* 全局重置，全屏展示 */
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #0a0f1e;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            pointer-events: none;
            user-select: none;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* 个人简历覆盖层（可选，如果还想保留文字） */
        .overlay {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            letter-spacing: 2px;
        }
        .overlay a {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            pointer-events: auto;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
        }
        .overlay a:hover {
            color: #a78bfa;
        }
    </style>
</head>
<body>

    <div id="info">🖱️ 拖动旋转 · 滚轮缩放 · 悬停碱基吸附</div>
    <div class="overlay">
        🧬 GujiaLi · 分子生物信息学 &nbsp;|&nbsp; <a href="#">📄 简历 (即将上传)</a>
    </div>

    <!-- 使用 Import Map 加载 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.152.0/examples/jsm/"
            }
        }
    </script>

    <!-- 加载独立的 DNA 模块 -->
    <script type="module">
        import { initDNA } from './dna.js';
        // 启动场景，传入挂载的 DOM 元素（这里直接使用 body，自动添加 canvas）
        initDNA();
    </script>

</body>
</html>
