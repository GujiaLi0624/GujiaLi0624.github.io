<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GujiaLi · 分子生物学家</title>
    <style>
        /* 重置页面边距，让画布铺满全屏 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0f1e;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            height: 100vh;
            color: white;
        }
        /* Canvas 作为底层背景 */
        #bioCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        /* 内容叠加层 - 你的个人介绍 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none; /* 让鼠标可以穿透点击画布（如果需要） */
        }
        .overlay h1 {
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60cfff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(96, 207, 255, 0.3);
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .overlay .sub {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 6px;
            font-weight: 300;
            backdrop-filter: blur(2px);
            padding: 8px 24px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .overlay .bio {
            margin-top: 30px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.5);
            max-width: 600px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        .overlay .btn-cv {
            margin-top: 35px;
            pointer-events: auto;
            padding: 14px 48px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(167, 139, 250, 0.5);
            border-radius: 50px;
            color: #c4b5fd;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 2px;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.1);
        }
        .overlay .btn-cv:hover {
            background: rgba(167, 139, 250, 0.2);
            border-color: #a78bfa;
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.3);
            transform: scale(1.05);
            color: #fff;
        }
        /* 右下角水印（可选） */
        .credit {
            position: absolute;
            bottom: 20px;
            right: 30px;
            z-index: 10;
            color: rgba(255,255,255,0.15);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }
        @media (max-width: 600px) {
            .overlay h1 { font-size: 2.8rem; }
            .overlay .sub { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- 特效画布 -->
    <canvas id="bioCanvas"></canvas>

    <!-- 你的个人简历内容 -->
    <div class="overlay">
        <h1>GujiaLi</h1>
        <div class="sub">🧬 分子生物学 · 系统生物信息</div>
        <div class="bio">
            探索基因表达的奥秘 · 从中心法则到复杂生命系统
        </div>
        <!-- 这里把 # 换成你将来上传的简历 PDF 链接 -->
        <a href="#" class="btn-cv">📄 查看我的简历</a>
    </div>
    <div class="credit">DNA → RNA → Protein</div>

    <script>
        (function() {
            const canvas = document.getElementById('bioCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            // ---------- 画布尺寸自适应 ----------
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            // ---------- 基础参数 ----------
            const AMPLITUDE = 120;          // 螺旋振幅
            const FREQ = 0.025;             // 螺旋频率
            const BASE_SPEED = 0.008;       // 流动速度
            const BASE_RADIUS = 6;           // 碱基圆点大小

            // 存储浮动蛋白质（折叠结构）
            let proteins = [];

            // ---------- 工具：生成随机颜色（碱基用） ----------
            function baseColor(base) {
                const map = {
                    'A': '#ff6b6b', // 红
                    'T': '#4ecdc4', // 青
                    'G': '#ffe66d', // 黄
                    'C': '#a29bfe', // 紫
                    'U': '#fd79a8'  // 粉
                };
                return map[base] || '#ffffff';
            }

            // ---------- 初始化浮动蛋白质 ----------
            function initProteins(count = 18) {
                proteins = [];
                for (let i = 0; i < count; i++) {
                    proteins.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.25,
                        vy: (Math.random() - 0.5) * 0.25,
                        radius: 8 + Math.random() * 18,
                        parts: 3 + Math.floor(Math.random() * 4), // 构成蛋白质的亚基数量
                        phase: Math.random() * Math.PI * 2,
                        color: `hsla(${Math.random() * 40 + 220}, 70%, 60%, 0.35)`, // 蓝紫色系
                        pulse: 0.5 + Math.random() * 0.5
                    });
                }
            }
            initProteins();

            // ---------- 绘制浮动蛋白质（模拟折叠） ----------
            function drawProtein(p, time) {
                const { x, y, radius, parts, color, phase, pulse } = p;
                const angleOffset = time * 0.01 + phase;
                const r = radius * (0.8 + 0.2 * Math.sin(time * 0.02 + phase));

                ctx.save();
                ctx.shadowColor = color;
                ctx.shadowBlur = 25;

                // 绘制多个相连的球体形成折叠结构
                for (let i = 0; i < parts; i++) {
                    const a = angleOffset + (i / parts) * Math.PI * 2;
                    const dx = Math.cos(a) * r * 0.7;
                    const dy = Math.sin(a) * r * 0.7;
                    const rad = r * 0.4 + 2 * Math.sin(time * 0.03 + i + phase);

                    ctx.beginPath();
                    ctx.arc(x + dx, y + dy, rad, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();

                    // 内部的亮核
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(x + dx * 0.5, y + dy * 0.5, rad * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fill();
                }

                // 中心连接线（模拟肽键）
                ctx.shadowBlur = 5;
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.3;
                for (let i = 0; i < parts; i++) {
                    const a1 = angleOffset + (i / parts) * Math.PI * 2;
                    const a2 = angleOffset + ((i + 1) % parts / parts) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(x + Math.cos(a1) * r * 0.7, y + Math.sin(a1) * r * 0.7);
                    ctx.lineTo(x + Math.cos(a2) * r * 0.7, y + Math.sin(a2) * r * 0.7);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // ---------- 更新蛋白质位置（边界反弹） ----------
            function updateProteins() {
                for (let p of proteins) {
                    p.x += p.vx;
                    p.y += p.vy;
                    // 边界柔和反弹
                    if (p.x < 0 || p.x > width) p.vx *= -0.98;
                    if (p.y < 0 || p.y > height) p.vy *= -0.98;
                    // 限制边界
                    p.x = Math.max(0, Math.min(width, p.x));
                    p.y = Math.max(0, Math.min(height, p.y));
                }
            }

            // ---------- 主绘制循环（DNA + RNA + 蛋白质） ----------
            function draw(time) {
                ctx.clearRect(0, 0, width, height);

                // ----- 1. 绘制深空渐变背景 -----
                const grad = ctx.createRadialGradient(
                    width / 2, height / 2, 0,
                    width / 2, height / 2, Math.max(width, height) * 0.7
                );
                grad.addColorStop(0, '#141b2d');
                grad.addColorStop(1, '#070a12');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // ----- 2. 绘制 DNA 双螺旋（贯穿画面） -----
                const centerX = width / 2;
                const step = 1.2; // 每步像素
                const totalSteps = Math.ceil(height / step);

                // 让螺旋向上流动
                const flowOffset = time * BASE_SPEED * 80;

                for (let i = 0; i < totalSteps; i++) {
                    const y = i * step;
                    // 角度随高度和时间变化
                    const angle = y * FREQ + time * 0.015 + flowOffset * 0.01;

                    // 两条链的 X 坐标
                    const x1 = centerX + Math.sin(angle) * AMPLITUDE;
                    const x2 = centerX + Math.sin(angle + Math.PI) * AMPLITUDE;

                    // 计算碱基类型（A/T/G/C）根据角度和时间变化
                    const baseIndex = Math.floor((angle * 3 + time * 0.01) % 4);
                    const bases = ['A', 'T', 'G', 'C'];
                    const base1 = bases[baseIndex % 4];
                    const base2 = bases[(baseIndex + 2) % 4];

                    // ---- 绘制碱基对（连接两条链的横档） ----
                    const gradient = ctx.createLinearGradient(x1, y, x2, y);
                    const c1 = baseColor(base1);
                    const c2 = baseColor(base2);
                    gradient.addColorStop(0, c1);
                    gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
                    gradient.addColorStop(1, c2);

                    ctx.beginPath();
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 1.8;
                    ctx.shadowColor = 'rgba(167, 139, 250, 0.2)';
                    ctx.shadowBlur = 8;
                    ctx.stroke();

                    // ---- 绘制碱基圆点（链上的节点） ----
                    // 链1 节点
                    ctx.shadowColor = c1;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(x1, y, BASE_RADIUS * (0.7 + 0.3 * Math.sin(angle * 0.5 + time)), 0, Math.PI * 2);
                    ctx.fillStyle = c1;
                    ctx.fill();

                    // 链2 节点
                    ctx.shadowColor = c2;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(x2, y, BASE_RADIUS * (0.7 + 0.3 * Math.sin(angle * 0.5 + time + 1)), 0, Math.PI * 2);
                    ctx.fillStyle = c2;
                    ctx.fill();

                    // 在横档中间写小字母（碱基符号），只隔几行显示，避免太密
                    if (i % 6 === 0) {
                        ctx.shadowBlur = 0;
                        ctx.font = '10px monospace';
                        ctx.fillStyle = 'rgba(255,255,255,0.25)';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const midX = (x1 + x2) / 2;
                        ctx.fillText(base1 + '—' + base2, midX, y - 12);
                    }
                }

                // ----- 3. 绘制 RNA 转录（移动的发光粒子拖尾） -----
                const rnaY = (time * 0.4) % height;
                const rnaAngle = rnaY * FREQ + time * 0.02;
                const rnaX = centerX + Math.sin(rnaAngle) * AMPLITUDE * 0.9;

                // 拖尾效果（RNA聚合酶复合体）
                for (let j = 0; j < 15; j++) {
                    const trail = j * 3;
                    const ty = rnaY - trail;
                    if (ty < 0) continue;
                    const tAngle = ty * FREQ + time * 0.02;
                    const tx = centerX + Math.sin(tAngle) * AMPLITUDE * 0.9 + Math.sin(tAngle * 0.5 + time * 0.02) * 6;
                    const alpha = 0.6 - (j / 15) * 0.6;
                    const radius = 3 + (j / 15) * 6;

                    ctx.beginPath();
                    ctx.arc(tx, ty, radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(253, 121, 168, ${alpha})`; // RNA粉色
                    ctx.shadowColor = '#fd79a8';
                    ctx.shadowBlur = 30;
                    ctx.fill();
                }

                // 核心 RNA 聚合酶（大亮点）
                ctx.shadowColor = '#fd79a8';
                ctx.shadowBlur = 50;
                ctx.beginPath();
                ctx.arc(rnaX, rnaY, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#fd79a8';
                ctx.fill();
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(rnaX - 4, rnaY - 4, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();

                // 释放的 mRNA 小颗粒
                for (let k = 0; k < 8; k++) {
                    const offX = (k - 4) * 18 + Math.sin(time * 0.05 + k) * 8;
                    const offY = 20 + k * 6 + Math.sin(time * 0.03 + k * 0.5) * 4;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(rnaX + offX, rnaY + offY, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(253, 121, 168, ${0.4 + 0.2 * Math.sin(time + k)})`;
                    ctx.fill();
                }

                // ----- 4. 绘制漂浮的蛋白质（折叠结构） -----
                updateProteins();
                for (let p of proteins) {
                    drawProtein(p, time);
                }

                // 画一些游离的mRNA小圆圈（补充背景细节）
                for (let i = 0; i < 30; i++) {
                    const seed = i * 137.508;
                    const x = (Math.sin(seed + time * 0.002) * 0.5 + 0.5) * width;
                    const y = (Math.cos(seed * 1.3 + time * 0.003) * 0.5 + 0.5) * height;
                    const rad = 1 + Math.sin(seed + time * 0.01) * 0.8;
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 0.1 + 0.05 * Math.sin(time * 0.005 + i);
                    ctx.beginPath();
                    ctx.arc(x, y, rad, 0, Math.PI * 2);
                    ctx.fillStyle = '#a78bfa';
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                requestAnimationFrame(draw);
            }

            // 启动动画
            requestAnimationFrame(draw);

            // 窗口大小改变时重置蛋白质位置
            window.addEventListener('resize', () => {
                resize();
                // 把移出边界的蛋白质拉回来
                for (let p of proteins) {
                    p.x = Math.min(width, p.x);
                    p.y = Math.min(height, p.y);
                }
            });

        })();
    </script>
</body>
</html>
